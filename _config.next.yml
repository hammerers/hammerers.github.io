# ---------------------------------------------------------------
# NexT Theme Custom Configuration
# ---------------------------------------------------------------

# Schemes: Muse | Mist | Pisces | Gemini
scheme: Gemini

# Dark Mode
darkmode: false

# Favicon
favicon:
  small: /images/favicon-16x16-next.png
  medium: /images/favicon-32x32-next.png
  apple_touch_icon: /images/apple-touch-icon-next.png
  safari_pinned_tab: /images/logo.svg

# Custom Styles & Head Injection
custom_file_path:
  head: source/_data/head.njk
  style: source/_data/styles.styl

# Menu Settings
menu:
  home: / || fa fa-home
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  search: /search/ || fa fa-search

# Sidebar Settings
sidebar:
  position: left
  width: 300
  padding: 18
  offset: 12

# Avatar
avatar:
  url: https://github.com/hammerers.png
  rounded: true
  rotated: false

# Social Links
social:
  GitHub: https://github.com/hammerers || fab fa-github
  # E-Mail: mailto:your_email@example.com || fa fa-envelope

# Codeblock Settings
codeblock:
  theme:
    light: default
    dark: github-dark
  copy_button:
    enable: true
    style: mac

# Local Search (设置为 false 以使用独立搜索页面)
local_search:
  enable: false
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# Reading progress & Pace
pace:
  enable: true
  theme: minimal

# Back to top
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# Math formula support
math:
  mathjax:
    enable: true
    tags: none

# Table of contents
toc:
  enable: true
  number: true
  wrap: false
  expand_all: true
  max_depth: 3

# Footer
footer:
  since: 2026
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff6b81"
